name: Security Audit

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FAIL_LEVEL: moderate

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Job summary
        if: always()
        run: |
          {
            echo '```'
            pnpm audit --ignore-registry-errors 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on advisories
        run: pnpm audit --audit-level="$FAIL_LEVEL" --ignore-registry-errors

  auto-remediate:
    name: Auto-remediate advisories
    needs: audit
    if: >-
      always()
      && needs.audit.result == 'failure'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Attempt automatic fix
        id: fix
        run: |
          before=$(sha256sum package.json pnpm-lock.yaml)
          pnpm audit --fix --ignore-registry-errors || true
          pnpm install --no-frozen-lockfile
          after=$(sha256sum package.json pnpm-lock.yaml)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify after fix
        if: steps.fix.outputs.changed == 'true'
        run: pnpm run verify

      - name: Open remediation pull request
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="chore/security-audit-fix-$(date +%Y%m%d)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: apply pnpm audit --fix overrides"
          git push origin "$BRANCH"

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "fix: automated security audit fix" \
            --body "Generated by \`pnpm audit --fix\`. \`pnpm run verify\` passed. Review the \`package.json\` diff before merging."

      - name: Open issue when auto-fix is not possible
        if: steps.fix.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: '[security] Manual remediation required'
        run: |
          set -euo pipefail

          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number')" ]; then
            exit 0
          fi

          pnpm audit --ignore-registry-errors > "$RUNNER_TEMP/audit.txt" 2>&1 || true

          {
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            head -c 55000 "$RUNNER_TEMP/audit.txt"
            echo '```'
          } > "$RUNNER_TEMP/issue-body.md"

          gh label create security --color d73a4a 2>/dev/null || true

          gh issue create \
            --title "$TITLE" \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --label security
